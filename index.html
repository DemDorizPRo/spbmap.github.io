<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Карта Санкт-Петербурга — расширенная</title>
<link rel="stylesheet" href="leaflet.css" />
<style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }

    .leaflet-control-attribution { display: none !important; }

    /* Общая панель */
    .panel {
        background: rgba(255,255,255,0.95);
        padding: 8px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        font-size: 13px;
        user-select: none;
    }
    .panel button {
        width: 34px; height: 34px;
        margin: 1px;
        font-size: 15px;
        cursor: pointer;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 6px;
    }
    .panel button:hover { background: #eef; }
    .panel .row { display: flex; align-items: center; gap: 6px; }
    .panel input[type=range] { width: 140px; }

    /* Панель управления (справа сверху) */
    #controls { position: absolute; top: 10px; right: 10px; z-index: 1000; }

    /* Инфо-панель (слева снизу) */
    #info {
        position: absolute; left: 10px; bottom: 10px; z-index: 1000;
        line-height: 1.4;
    }
    #info b { color: #036; }

    /* Переключатель слоёв */
    #layers { position: absolute; top: 10px; left: 10px; z-index: 1000; }
    #layers label { display: flex; align-items: center; gap: 6px; margin: 2px 0; cursor: pointer; }

    /* Кнопка сброса маркеров */
    #clear-marks { margin-top: 4px; width: 100%; height: 28px; }
</style>
</head>
<body>
<div id="map"></div>

<!-- Слои -->
<div id="layers" class="panel">
    <div><b>Слой карты</b></div>
    <label><input type="radio" name="layer" value="osm" checked> OpenStreetMap</label>
    <label><input type="radio" name="layer" value="sat"> Спутник</label>
    <label><input type="radio" name="layer" value="dark"> Тёмная</label>
    <label><input type="radio" name="layer" value="topo"> Рельеф</label>
    <button id="clear-marks" title="Удалить все маркеры">Очистить метки</button>
</div>

<!-- Управление -->
<div id="controls" class="panel">
    <div class="row">
        <button id="zoom-in"  title="Приблизить">+</button>
        <button id="zoom-out" title="Отдалить">−</button>
        <button id="home"     title="Домой (H)">🏠</button>
    </div>
    <div class="row" style="margin-top:4px;">
        <button id="rot-left"  title="Повернуть влево (←)">⟲</button>
        <button id="rot-right" title="Повернуть вправо (→)">⟳</button>
        <button id="rot-reset" title="Сбросить поворот (R)">⭯</button>
    </div>
    <div class="row" style="margin-top:6px;">
        <input type="range" id="rot-slider" min="0" max="360" value="0" step="1">
        <span id="rot-value">0°</span>
    </div>
    <div class="row" style="margin-top:6px;">
        <button id="locate" title="Моё местоположение">📍</button>
        <button id="fullscreen" title="Полный экран (F)">⛶</button>
    </div>
</div>

<!-- Инфо -->
<div id="info" class="panel">
    <div>Курсор: <b id="coords">—</b></div>
    <div>Зум: <b id="zoom">—</b> &nbsp;|&nbsp; Угол: <b id="bearing">0°</b></div>
</div>

<script src="leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>

<script>
/* ============ Константы ============ */
const SPB = [59.934280, 30.335099];
const HOME = { center: SPB, zoom: 13, bearing: 0 };

/* Ограничения (при желании меняй) */
const LIMITS = {
    minZoom: 10,
    maxZoom: 18,
    maxBounds: L.latLngBounds([59.60, 29.40], [60.25, 31.20]) // рамка вокруг СПб
};

/* ============ Инициализация карты ============ */
const map = L.map('map', {
    center: SPB,
    zoom: 13,

    // Плавный зум
    zoomSnap: 0,
    zoomDelta: 0.5,
    wheelPxPerZoomLevel: 120,
    wheelDebounceTime: 40,

    // Вращение
    rotate: true,
    bearing: 0,
    touchRotate: true,
    shiftKeyRotate: true,
    rotateControl: false,
    rotateWhileZooming: true,

    // Ограничения
    minZoom: LIMITS.minZoom,
    maxZoom: LIMITS.maxZoom,
    maxBounds: LIMITS.maxBounds,
    maxBoundsViscosity: 1.0,
    worldCopyJump: false,
    noWrap: true,

    // Меньше мешающих жестов
    tap: false,
    boxZoom: true,
    doubleClickZoom: true
});

/* ============ Слои ============ */
const layers = {
    osm : L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, noWrap: true
    }),
    sat : L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, noWrap: true
    }),
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, noWrap: true
    }),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        maxZoom: 17, noWrap: true
    })
};
layers.osm.addTo(map);

document.querySelectorAll('input[name="layer"]').forEach(r => {
    r.addEventListener('change', e => {
        Object.values(layers).forEach(l => map.removeLayer(l));
        layers[e.target.value].addTo(map);
    });
});

/* ============ Мини-карта и масштаб ============ */
L.control.scale({ imperial: false, position: 'bottomright' }).addTo(map);

/* ============ Сохранение позиции ============ */
const STORAGE_KEY = 'spb-map-view';
function saveView() {
    const c = map.getCenter();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
        lat: c.lat, lng: c.lng,
        zoom: map.getZoom(),
        bearing: map.getBearing()
    }));
}
function restoreView() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (s) {
            map.setView([s.lat, s.lng], s.zoom);
            map.setBearing(s.bearing || 0);
        }
    } catch(e) {}
}
restoreView();
map.on('moveend zoomend rotate', saveView);

/* ============ Панель управления ============ */
const slider = document.getElementById('rot-slider');
const rotVal = document.getElementById('rot-value');

function norm(deg){ return ((deg % 360) + 360) % 360; }
function setBearing(deg){
    deg = norm(deg);
    map.setBearing(deg);
    slider.value = deg;
    rotVal.textContent = Math.round(deg) + '°';
    document.getElementById('bearing').textContent = Math.round(deg) + '°';
}

document.getElementById('zoom-in').onclick  = () => map.zoomIn(0.5);
document.getElementById('zoom-out').onclick = () => map.zoomOut(0.5);
document.getElementById('home').onclick     = () => {
    map.flyTo(HOME.center, HOME.zoom, { duration: 1.2 });
    setTimeout(() => setBearing(HOME.bearing), 100);
};
document.getElementById('rot-left').onclick  = () => setBearing(map.getBearing() - 15);
document.getElementById('rot-right').onclick = () => setBearing(map.getBearing() + 15);
document.getElementById('rot-reset').onclick = () => setBearing(0);
slider.oninput = () => setBearing(parseFloat(slider.value));

/* Геолокация */
document.getElementById('locate').onclick = () => {
    if (!navigator.geolocation) return alert('Геолокация недоступна');
    navigator.geolocation.getCurrentPosition(
        pos => {
            const { latitude, longitude } = pos.coords;
            map.flyTo([latitude, longitude], 15, { duration: 1.2 });
            L.circleMarker([latitude, longitude], {
                radius: 8, color: '#06f', fillColor: '#08f', fillOpacity: 0.9
            }).addTo(map).bindPopup('Вы здесь').openPopup();
        },
        err => alert('Не удалось получить местоположение: ' + err.message)
    );
};

/* Полный экран */
document.getElementById('fullscreen').onclick = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) el.requestFullscreen?.();
    else document.exitFullscreen?.();
};

/* ============ Клик — поставить метку ============ */
const marks = [];
map.on('click', e => {
    const m = L.marker(e.latlng).addTo(map)
        .bindPopup(`${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`);
    marks.push(m);
});
document.getElementById('clear-marks').onclick = () => {
    marks.forEach(m => map.removeLayer(m));
    marks.length = 0;
};

/* ============ Инфо-панель ============ */
const coordsEl = document.getElementById('coords');
const zoomEl   = document.getElementById('zoom');
const bearEl   = document.getElementById('bearing');

map.on('mousemove', e => {
    coordsEl.textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
});
map.on('zoom', () => zoomEl.textContent = map.getZoom().toFixed(2));
map.on('rotate', () => {
    const b = norm(map.getBearing());
    slider.value = b;
    rotVal.textContent = Math.round(b) + '°';
    bearEl.textContent = Math.round(b) + '°';
});
zoomEl.textContent = map.getZoom().toFixed(2);

/* ============ Горячие клавиши ============ */
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.key) {
        case '+': case '=': map.zoomIn(0.5); break;
        case '-': case '_': map.zoomOut(0.5); break;
        case 'ArrowLeft':  setBearing(map.getBearing() - 10); break;
        case 'ArrowRight': setBearing(map.getBearing() + 10); break;
        case 'r': case 'R': setBearing(0); break;
        case 'h': case 'H': map.flyTo(HOME.center, HOME.zoom, { duration: 1.2 }); break;
        case 'f': case 'F': document.getElementById('fullscreen').click(); break;
    }
});

/* ============ Мягкая защита границ при повороте ============ */
map.on('rotate', () => {
    // Если при повороте вылезли за maxBounds — мягко возвращаемся
    setTimeout(() => {
        if (!LIMITS.maxBounds.contains(map.getBounds().getCenter()) &&
            !LIMITS.maxBounds.contains(map.getCenter())) {
            map.panInsideBounds(LIMITS.maxBounds, { animate: true });
        }
    }, 200);
});
</script>
</body>
</html>
