<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта Санкт-Петербурга</title>
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Скрываем надпись Leaflet */
        .leaflet-control-attribution {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="leaflet.js"></script>
    <script>
        // Карта с центром в Санкт-Петербурге
        var map = L.map('map').setView([59.934280, 30.335099], 13);
        
        // Слой карты - без надписи
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: ''
        }).addTo(map);
        
        // Без маркеров, без флагов - просто чистая карта
    </script>
</body>
</html>
